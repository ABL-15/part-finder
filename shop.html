<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part Finder</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
        rel="stylesheet">
    <script src="search.js"></script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <a href="index.html"><img class="logo-img" img src="images/logo.png" alt="Logo" width="115px" </a>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <img class="cart-img" img src="images/trolley.png" alt="Cart" width="50px">
                    <div class="search-container">
                        <input id="searchInput" style="border-radius: 10px; font-size: medium;" type="search"
                            placeholder="Search.." name="search">
                    </div>
            </ul>
        </nav>
    </header>
    <h1>Shop</h1>

    <main>
	<!--Setting a Grid-->
	<div class="inventory-grid">
		<!--Items in Shop-->
		<div class="inventory-item">
			<img src="images/testing.jpg" alt="Item 1">
			<h3>Testing</h3>
			<p>$30.00</p>
			<button>Add to Cart</button>
		</div>

    <footer>
        <nav>
            <ul>
                <li>
                    <!--Links to Social Media Pages-->
                    <a href="https://instagram.com" target="_blank">
                        <img class="social-img" src="images/insta.png" alt="Instagram" height="40">
                    </a>
                </li>
                <li>
                    <a href="https://facebook.com" target="_blank">
                        <img class="social-img" src="images/fb.png" alt="Facebook" height="40">
                    </a>
                </li>
                <li>
                    <a href="https://tiktok.com" target="_blank">
                        <img class="social-img" src="images/tiktok.png" alt="TikTok" height="40">
                    </a>
                </li>
            </ul>
        </nav>
    </footer>
</body>

</html>
